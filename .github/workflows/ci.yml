name: Alpha Pay CI Pipeline

on:
  push:
    branches: [ "alpha" ]
  pull_request:
    branches: [ "alpha" ]

env:
  DB_URL: ${{ secrets.DB_URL }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: |
          chmod +x "eureka-server/gradlew"
          chmod +x "Alpha Pay/gradlew"
          chmod +x "api-gateway/gradlew"
          chmod +x "wallet/gradlew"
          chmod +x "Transaction/gradlew"

      - name: Build Eureka Server
        working-directory: "eureka-server"
        run: ./gradlew build -x test

      - name: Build Alpha Pay User Service
        working-directory: "Alpha Pay"
        run: ./gradlew build -x test

      - name: Build API Gateway
        working-directory: "api-gateway"
        run: ./gradlew build -x test

      - name: Build Alpha Pay Wallet Service
        working-directory: "wallet"
        run: ./gradlew build -x test

      - name: Build Alpha Pay Transaction Service
        working-directory: "Transaction"
        run: ./gradlew build -x test