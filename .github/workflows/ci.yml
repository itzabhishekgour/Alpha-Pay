name: Alpha Pay CI Pipeline

on:
  push:
    branches: [ "alpha" ]
  pull_request:
    branches: [ "alpha" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: |
          chmod +x "Alpha Pay/gradlew"
          chmod +x "api-gateway/gradlew"

      - name: Build Alpha pay User Service
        working-directory: "Alpha Pay"
        run: ./gradlew build

      - name: Build API Gateway
        working-directory: "api-gateway"
        run: ./gradlew build