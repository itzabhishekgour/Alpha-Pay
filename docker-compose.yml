services:
  # ==========================================
  # MICROSERVICES
  # ==========================================
  user-service:
    build: "./Alpha Pay"   # Folder name updated
    ports:
      - "8081:8081"
    env_file:
      - .env

  wallet-service:
    build: ./wallet       
    ports:
      - "8083:8083"
    env_file:
      - .env

  transaction-service:
    build: ./Transaction   # Folder name updated
    ports:
      - "8082:8082"
    env_file:
      - .env

  api-gateway:
    build: ./api-gateway   # Folder name updated
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - wallet-service
      - transaction-service